        - generic [ref=e39]:
          - paragraph [ref=e40]: 01 / Project definition
          - heading "Manufacturing evidence before industrial tooling." [level=2] [ref=e41]
          - paragraph [ref=e42]: InFlux Origin MK1 is a desktop-scale injection molding prototype built to help teams learn from real thermoplastic parts before committing to conventional production tooling. It is intended for process learning, functional validation, education, and future short-run experimentation.
          - paragraph [ref=e43]: The project does not claim to replace an industrial injection molding machine. Its purpose is to reduce the distance between a 3D printed model and a professionally tooled production part by making the molding process more accessible, measurable, and iterative.
        - generic [ref=e44]:
          - paragraph [ref=e45]: 02 / System architecture
          - heading "A complete machine, not an isolated mechanism." [level=2] [ref=e46]
          - paragraph [ref=e47]: "The platform is organized into six connected layers:"
          - list [ref=e48]:
            - listitem [ref=e49]: Structural frame and aligned movement system.
            - listitem [ref=e50]: Heated barrel, nozzle, and piston-driven injection path.
            - listitem [ref=e51]: Mold support, closing movement, and rapid tooling package.
            - listitem [ref=e52]: Power distribution, sensors, motion drivers, and emergency inputs.
            - listitem [ref=e53]: Nucleo machine firmware and ESP32-C6 communication bridge.
            - listitem [ref=e54]: Android operator interface and diagnostic support tools.
          - paragraph [ref=e55]: The Nucleo controller owns machine state, heating, motion, safety checks, and cycle behavior. The ESP bridge translates same-network operator requests into the machine command protocol. The Android application presents status and sends supported commands.
          - heading "Confirmed platform summary" [level=3] [ref=e56]
          - generic [ref=e57]:
            - generic [ref=e58]:
              - term [ref=e59]: Machine controller
              - definition [ref=e60]: NUCLEO-H753ZI
            - generic [ref=e61]:
